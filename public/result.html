<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EcoTrack AI Dashboard</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="dashboard">

<h1>🌱 EcoTrack AI</h1>

<h2 id="welcome"></h2>

<div class="card">

<h3>🌍 Carbon Footprint</h3>

<h1 id="carbon">-- kg/day</h1>

</div>

<div class="card">

<h3>🏆 Eco Score</h3>

<h1 id="score">--</h1>

</div>

<div class="card">

<h3>🤖 AI Climate Coach</h3>

<p id="coach"></p>

</div>

<div class="card">

<h3>🔮 Ask Future Me</h3>

<input
id="futureQuestion"
placeholder="What if I start cycling?"
>

<button id="askBtn">
Ask AI
</button>

<p id="futureAnswer"></p>

</div>

</div>

<script src="script.js"></script>

</body>

</html>
